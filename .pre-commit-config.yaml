exclude: '^(frontend/(node_modules|dist|build)/|backend/(venv|\.venv|__pycache__)/|data/|.*\.lock$)'

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml

  # Python formatting (backend only)
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        files: ^backend/.*\.py$
        args: [--line-length=88]

  # Python linting (backend only)
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        files: ^backend/.*\.py$
        args: [--max-line-length=88]

  # Frontend formatting (auto-fix)
  - repo: local
    hooks:
      - id: prettier-format
        name: Prettier format (frontend)
        entry: bash -c 'cd frontend && npm run format'
        language: system
        files: ^frontend/src/.*\.(ts|tsx|js|jsx|json|css|md)$
        pass_filenames: false
